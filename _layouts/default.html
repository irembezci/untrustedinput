<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="theme-color" content="#202124">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-name"><strong>untrusted</strong><span>input</span></span></a><a class="github-link" href="https://github.com/">GitHub ↗</a></header>
  {{ content }}
  <footer><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-name"><strong>untrusted</strong><span>input</span></span></a><span>AI SECURITY · RESEARCH NOTES</span><a href="#top">Back to top ↑</a></footer>
</body>
</html>
